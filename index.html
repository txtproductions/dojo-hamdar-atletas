<style>
:root{--navy:#091120;--blue:#2055c7;--gold:#d6ad60;--paper:#f3f5f9;--ink:#111827;--muted:#667085;--line:#e0e4eb;--green:#168a68}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}

.wrap{max-width:1100px;margin:auto} .brand{display:flex;align-items:center;gap:12px}.mark{width:48px;height:48px;border:2px solid var(--gold);border-radius:12px;display:grid;place-items:center;font-size:24px}
h1{font-size:clamp(22px,4vw,32px);margin:0}header p{margin:5px 0 0;color:#d5dfec}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}.tab,button{border:0;border-radius:9px;padding:10px 14px;font-weight:650;cursor:pointer}
.tab{background:#ffffff18;color:#fff}.tab.active{background:var(--gold);color:#172033}

.eyebrow{color:#916b24;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.hero h2{margin:4px 0;font-size:clamp(22px,3vw,29px)}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}
.card{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 5px 16px #18253b06}.card h3{margin:0 0 8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.stat{background:#f7f8fa;border-radius:10px;padding:12px}.stat b{font-size:22px;display:block}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#e8eef7;color:#27466e;font-size:12px;font-weight:750}.badge.gold{background:#fbf0d5;color:#775719}
button.primary{background:var(--blue);color:white}button.primary:hover{background:#1744a8}button.secondary{border:1px solid #d8dee8} .event-card{display:flex;flex-direction:column;gap:8px;min-height:100%;border-top:4px solid #2458c7}.event-title{font-size:22px;line-height:1.2;font-weight:850;letter-spacing:-.02em}.event-meta{display:flex;flex-wrap:wrap;gap:8px 14px;color:#596579;font-size:14px}.event-links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:16px 0}.event-link{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;font-weight:750;color:#172033}.event-link span{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:3px}.event-link:active{background:#eef3ff}.event-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.event-summary .stat{background:white;border:1px solid var(--line);border-radius:14px;padding:14px}.event-summary .stat b{font-size:26px}.searchbar{border:1px solid #d6dce6;border-radius:12px;padding:13px 15px;font-size:16px}.category-card{border:1px solid var(--line);border-radius:14px;background:#fff;margin:12px 0;overflow:hidden}.category-heading{padding:14px 16px;background:#f7f8fb;font-weight:850;display:flex;justify-content:space-between;gap:12px;align-items:center}.athlete-row{padding:13px 16px;border-top:1px solid #edf0f4;display:flex;justify-content:space-between;gap:12px;align-items:center}.athlete-row small{display:block;color:var(--muted);margin-top:2px}.event-status{color:var(--green);border:1px solid #8bcbb5;background:#e9f7f1;border-radius:30px;padding:7px 12px;font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}button.secondary{background:#e9edf3;color:#26364b}button.danger{background:#fee2e2;color:#991b1b}
input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:10px;background:white;font:inherit;margin:4px 0 12px}label{font-size:13px;font-weight:700;display:block}form{max-width:600px}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}th{color:#475569;background:#f8fafc}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:white}.empty{padding:28px;text-align:center;color:var(--muted)}
.live-courts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin:14px 0}.live-modes{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.live-mode{background:#0b1220;color:#fff;border:1px solid #344155;padding:12px 18px;border-radius:10px;font-weight:850}.live-mode.active{background:#d6ad60;color:#111827}.tv-board{background:#05070b;color:#fff;padding:16px;border-radius:14px}.tv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.tv-court{background:#101827;border:1px solid #273449;border-radius:10px;padding:12px}.tv-fight{display:grid;grid-template-columns:44px minmax(0,1fr);gap:7px;margin:7px 0;align-items:stretch}.tv-num{display:grid;place-items:center;background:#f4e642;color:#101827;font-weight:950;border-radius:4px}.tv-blue,.tv-red{padding:9px 10px;font-weight:850;min-width:0;overflow-wrap:anywhere}.tv-blue{background:#2055e5;color:#fff}.tv-red{background:#e52e40;color:#fff}.tv-blue small,.tv-red small{display:block;font-weight:500;opacity:.85;font-size:11px}.staff-screen{background:#05070b;color:#fff;border-radius:14px;padding:16px}.staff-layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(230px,1fr);gap:14px}.staff-current{background:#111827;padding:14px;border-radius:10px}.staff-current .tv-blue,.staff-current .tv-red{font-size:clamp(16px,2vw,24px);padding:16px}.staff-upcoming{background:#111827;border-radius:10px;padding:12px}@media(max-width:650px){.staff-layout{grid-template-columns:1fr}.tv-grid{grid-template-columns:1fr}}.live-court{background:#111827;border-radius:15px;padding:14px;color:#fff}.live-court h4{margin:0 0 12px;font-size:18px}.live-current{background:#1d4ed8;border-radius:10px;padding:12px;margin-bottom:12px}.live-next{display:flex;gap:10px;align-items:center;background:#fff;color:#111827;border-radius:9px;padding:9px;margin:7px 0}.live-next .num{background:#f4e642;color:#111827;font-weight:900;border-radius:5px;padding:8px;min-width:36px;text-align:center}.live-next small{display:block;color:#64748b}.live-status{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:900;color:#fde68a}.live-action{margin-top:9px;background:#f4e642;color:#111827;padding:8px 10px;border-radius:8px;font-weight:850}.fight-list{display:grid;gap:12px;margin:14px 0}.fight-card{background:#fff;border:1px solid #dfe4eb;border-left:5px solid #4382e8;border-radius:14px;padding:14px;box-shadow:0 3px 12px #18253b08}.fight-top{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.fight-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:20px;background:#eaf0ff;color:#2455ad;font-weight:800;font-size:13px}.fight-chip.court{background:#e9f2ff;color:#4382d9;border:1px solid #c8d9f1}.fight-chip.round{background:#fff3d4;color:#89621c;border:1px solid #f0d995}.fight-number{font-size:12px;color:#64748b}.fight-state{margin-left:auto;background:#fff0cc;color:#986718;border-radius:20px;padding:5px 9px;font-size:12px;font-weight:800}.fight-category{font-size:14px;font-weight:800;color:#515b6b;line-height:1.4;margin:10px 0}.fighter{background:#f7f8fa;border-radius:10px;padding:10px 11px;font-weight:850;line-height:1.35}.fighter small{display:block;font-size:12px;font-weight:500;color:#697386;margin-top:4px}.fight-vs{display:flex;align-items:center;gap:12px;color:#6b7280;font-size:12px;font-weight:900;letter-spacing:.12em;margin:7px 0}.fight-vs:before,.fight-vs:after{content:'';height:1px;background:#e5e7eb;flex:1}
.actions{display:flex;gap:8px;flex-wrap:wrap}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:10px 0 16px}
footer{text-align:center;color:var(--muted);padding:30px 15px;font-size:12px}.notice{background:#fff8e7;border:1px solid #f0d99f;border-radius:10px;padding:12px;margin:12px 0;font-size:13px}
.hidden{display:none!important}.small{font-size:12px}
@media(max-width:560px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:span 2}th,td{padding:8px}}
</style></head>
<body>
<header><div class="wrap">
 <div class="brand"><div class="mark">🥋</div><div><h1>DOJO HAMDAR</h1><p>Gestão de campeonatos de artes marciais</p></div></div>
 <nav id="nav"><button class="tab active" data-view="public">Campeonatos</button><button class="tab" data-view="results">Resultados</button><button class="tab" data-view="admin">Administração</button></nav>
</div></header>
<main id="app"></main>
<footer>DOJO HAMDAR • Protótipo inicial • Os dados desta versão ficam salvos apenas neste navegador.</footer>
<script>
const KEY='dojoHamdarPrototypeV1';
const seed={events:[{id:'ev1',name:'Festival Pequenos Guerreiros',date:'2026-10-17',city:'Rio Branco do Sul - PR',modality:'Taekwondo',status:'Planejamento',description:'Festival Pequenos Guerreiros — dia 17/10. Mais informações serão divulgadas pela organização.'},{id:'evt-teste',name:'Evento Teste',date:'2026-10-17',city:'Rio Branco do Sul - PR',modality:'Taekwondo',status:'Planejamento',description:'Evento de demonstração com atletas fictícios para testar inscritos, categorias, chaves e horários.'}],athletes:[],matches:[]};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed}catch(e){db=seed}
if(!Array.isArray(db.brackets)) db.brackets=[];
if(!Array.isArray(db.schedules)) db.schedules=[];
// Adiciona um evento de teste com atletas fictícios (2 a 6 por categoria) também a quem já abriu versões anteriores.
if(!db.events.some(e=>e.id==='evt-teste')) db.events.push({id:'evt-teste',name:'Evento Teste',date:'2026-10-17',city:'Rio Branco do Sul - PR',modality:'Taekwondo',status:'Planejamento',description:'Evento de demonstração com atletas fictícios para testar inscritos, categorias, chaves e horários.'});
if(!db.athletes.some(a=>a.eventId==='evt-teste')) {
 const demoGroups=[
  {age:'Fraldinha (até 6 anos)',sex:'Masculino',belt:'Branca',weights:[22,24,25],names:['Lucas Almeida','Miguel Santos','Arthur Lima']},
  {age:'Mirim (7 a 8 anos)',sex:'Feminino',belt:'Amarela a laranja',weights:[27,28,29,30],names:['Helena Costa','Alice Rocha','Laura Mendes','Manuela Dias']},
  {age:'Infantil (9 a 11 anos)',sex:'Masculino',belt:'Verde a azul clara',weights:[32,33,34],names:['Gabriel Silva','Pedro Martins','Davi Ferreira']},
  {age:'Cadete (12 a 14 anos)',sex:'Feminino',belt:'Roxa a ponta preta',weights:[43,44,45],names:['Isabela Ribeiro','Valentina Gomes','Sophia Carvalho']},
  {age:'Júnior (15 a 17 anos)',sex:'Masculino',belt:'Amarela a laranja',weights:[50,52,54,55],names:['Enzo Oliveira','Matheus Lopes','Bernardo Souza','Heitor Alves']},
  {age:'Adulto (18 a 30 anos)',sex:'Feminino',belt:'Verde a azul clara',weights:[52,54,56],names:['Mariana Nunes','Beatriz Cardoso','Clara Teixeira']},
  {age:'Master (acima de 30 anos)',sex:'Masculino',belt:'Preta',weights:[68,72,78],names:['Rafael Monteiro','André Batista','Eduardo Freitas']}
 ];
 function demoWeightDivision(age,sex,weight){if(age.startsWith('Fraldinha')||age.startsWith('Mirim'))return 'Sem divisão de peso';let limits;if(age.startsWith('Infantil'))limits=[30,35,40,45];else if(age.startsWith('Cadete'))limits=sex==='Masculino'?[37,45,53,61]:[37,44,51,59];else if(age.startsWith('Júnior'))limits=sex==='Masculino'?[45,51,55,59,63,68,73]:[42,46,49,53,57,62];else if(age.startsWith('Adulto'))limits=sex==='Masculino'?[58,68,80]:[49,57,67];else limits=sex==='Masculino'?[58,68,80]:[49,57,67];const n=limits.find(x=>weight<=x);return n===undefined?`Acima de ${limits[limits.length-1]} kg`:`Até ${n} kg`;}
 demoGroups.forEach(g=>g.names.forEach((name,i)=>{const weight=g.weights[i],category=`${g.age.split(' (')[0]} • ${g.sex} • ${demoWeightDivision(g.age,g.sex,weight)} • ${g.belt}`;db.athletes.push({id:`demo-${db.athletes.length+1}`,eventId:'evt-teste',name,team:['Dojo Hamdar','Equipe Tigres','Equipe Dragões'][i%3],belt:g.belt,ageGroup:g.age,sex:g.sex,weight:String(weight),category});}));
 try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}
}
// Completa o Evento Teste com 100 atletas fictícios, inclusive em versões já abertas anteriormente.
// Os atletas de demonstração existentes são mantidos; os novos são distribuídos em grupos de categoria.
{
 const testEventId='evt-teste';
 const existing=db.athletes.filter(a=>a.eventId===testEventId);
 const firstNames=['João','Pedro','Lucas','Gabriel','Matheus','Davi','Enzo','Arthur','Miguel','Rafael','Heitor','Bruno','Gustavo','Felipe','Leonardo','Caio','Samuel','Nicolas','Eduardo','Vinícius','Ana','Julia','Mariana','Isabela','Helena','Laura','Alice','Manuela','Valentina','Sophia','Beatriz','Clara','Luiza','Lívia','Camila','Amanda','Yasmin','Eloá','Heloísa','Rebeca'];
 const surnames=['Silva','Santos','Oliveira','Souza','Lima','Pereira','Costa','Ferreira','Rodrigues','Almeida','Nascimento','Carvalho','Gomes','Martins','Ribeiro','Alves','Monteiro','Mendes','Barbosa','Cardoso','Rocha','Teixeira','Moreira','Correia','Freitas'];
 const ages=['Fraldinha (até 6 anos)','Mirim (7 a 8 anos)','Infantil (9 a 11 anos)','Cadete (12 a 14 anos)','Júnior (15 a 17 anos)','Adulto (18 a 30 anos)','Master (acima de 30 anos)'];
 const belts=['Branca','Amarela a laranja','Verde a azul clara','Roxa a ponta preta','Preta'];
 const teams=['Dojo Hamdar','Equipe Tigres','Equipe Dragões','CT Vale','Equipe Fênix','Academia Horizonte','Equipe União','Taekwondo Paraná'];
 function testWeightDivision(age,sex,w){if(age.startsWith('Fraldinha')||age.startsWith('Mirim'))return 'Sem divisão de peso';let lim;if(age.startsWith('Infantil'))lim=[30,35,40,45];else if(age.startsWith('Cadete'))lim=sex==='Masculino'?[37,45,53,61]:[37,44,51,59];else if(age.startsWith('Júnior'))lim=sex==='Masculino'?[45,51,55,59,63,68,73]:[42,46,49,53,57,62];else lim=sex==='Masculino'?[58,68,80]:[49,57,67];const n=lim.find(x=>w<=x);return n===undefined?`Acima de ${lim[lim.length-1]} kg`:`Até ${n} kg`;}
 let n=existing.length;
 // Use combinações de categoria com cinco atletas por grupo para testar agrupamento e chaves.
 const groups=[];
 for(const age of ages){for(const sex of ['Masculino','Feminino']){for(const belt of belts){groups.push({age,sex,belt});}}}
 let groupIndex=0, within=0;
 while(n<100){
   const g=groups[groupIndex%groups.length];
   const weights=g.age.startsWith('Fraldinha')?[20,22,24,25,26]:g.age.startsWith('Mirim')?[25,27,28,29,30]:g.age.startsWith('Infantil')?[31,33,35,38,42]:g.age.startsWith('Cadete')?(g.sex==='Masculino'?[38,42,47,55,60]:[38,41,46,53,58]):g.age.startsWith('Júnior')?(g.sex==='Masculino'?[46,50,54,60,66]:[43,47,51,56,61]):g.age.startsWith('Adulto')?(g.sex==='Masculino'?[60,64,70,76,82]:[50,54,59,63,69]):(g.sex==='Masculino'?[60,66,72,78,84]:[50,54,59,63,69]);
   const w=weights[within%5];
   const category=`${g.age.split(' (')[0]} • ${g.sex} • ${testWeightDivision(g.age,g.sex,w)} • ${g.belt}`;
   const idx=n;
   const fullName=`${firstNames[idx%firstNames.length]} ${surnames[Math.floor(idx/firstNames.length)%surnames.length]}${idx>=firstNames.length* surnames.length?' '+(Math.floor(idx/100)+1):''}`;
   db.athletes.push({id:`test100-${idx+1}`,eventId:testEventId,name:fullName,team:teams[idx%teams.length],belt:g.belt,ageGroup:g.age,sex:g.sex,weight:String(w),category});
   n++;within++;
   if(within===5){within=0;groupIndex++;}
 }
 try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}
}

// Atualiza o evento de demonstração anterior para o Festival Pequenos Guerreiros.
if(db.events && db.events.length===1 && db.events[0].id==='ev1' && db.events[0].name==='Campeonato de Taekwondo Dojo Hamdar'){db.events[0]={...db.events[0],name:'Festival Pequenos Guerreiros',date:'2026-10-17',city:'Rio Branco do Sul - PR',modality:'Taekwondo',status:'Planejamento',description:'Festival Pequenos Guerreiros — dia 17/10. Mais informações serão divulgadas pela organização.'};try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
let view='public';
const app=document.querySelector('#app');
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateFmt(s){if(!s)return 'Data a definir';const [y,m,d]=s.split('-');return `${d}/${m}/${y}`}
function eventName(id){return db.events.find(e=>e.id===id)?.name||'Campeonato removido'}
function stat(n,l){return `<div class="stat"><b>${n}</b><span class="muted">${l}</span></div>`}
function render(){
 document.querySelector('header').style.display='';
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
 if(view==='public') publicView(); if(view==='results') resultsView(); if(view==='admin') adminView();
}
function publicView(){
 const featured=db.events.find(e=>e.name==='Festival Pequenos Guerreiros')||db.events[0];
 app.innerHTML=`<section class="hero"><div><div class="eyebrow">DOJO HAMDAR · PLATAFORMA DE EVENTOS</div><h2>Campeonatos de Taekwondo</h2><div class="muted">Eventos, atletas inscritos, cronograma e chaves em um só lugar.</div></div><span class="badge gold">Área pública</span></section>
 <div class="stats">${stat(db.events.length,'Eventos')}${stat(db.athletes.length,'Atletas inscritos')}${stat(db.matches.length,'Resultados publicados')}</div>
 <div class="sectionhead"><div><h2 style="margin:0">Eventos disponíveis</h2><p class="muted" style="margin:3px 0">Selecione um evento para consultar as informações.</p></div></div>
 <div class="grid">${db.events.length?db.events.map(e=>{const count=db.athletes.filter(a=>a.eventId===e.id).length;return `<article class="card event-card"><span class="badge">${esc(e.status)}</span><div class="event-title">${esc(e.name)}</div><div class="event-meta"><span>▦ ${dateFmt(e.date)}</span><span>⌖ ${esc(e.city||'Local a definir')}</span></div><p class="muted">${esc(e.modality||'Taekwondo')} · ${count} atleta(s) cadastrado(s)</p><div style="margin-top:auto"><button class="primary" style="width:100%" onclick="showEvent('${e.id}')">Acessar evento →</button></div></article>`}).join(''):'<div class="empty">Ainda não há campeonatos cadastrados.</div>'}</div>`;
}
function showEvent(id,section='inicio',search=''){const e=db.events.find(x=>x.id===id);if(!e)return;const athletes=db.athletes.filter(a=>a.eventId===id);const schedule=db.schedules.find(x=>x.eventId===id);const brackets=db.brackets.filter(x=>x.eventId===id);const matches=db.matches.filter(x=>x.eventId===id);const totalCats=new Set(athletes.map(a=>a.category||'Categoria não definida')).size;
 const nav=`<div class="event-links"><button class="event-link" onclick="showEvent('${id}','inscricoes')">♧ Inscrições <span>Atletas por categoria</span></button><button class="event-link" onclick="showEvent('${id}','cronograma')">◷ Cronograma <span>Horários por quadra</span></button><button class="event-link" onclick="showEvent('${id}','chaves')">♧ Chaves <span>Confrontos e pareamentos</span></button><button class="event-link" onclick="showEvent('${id}','aovivo')">● Ao vivo <span>Resultados registrados</span></button></div>`;
 let content='';
 if(section==='inscricoes'){
 const q=search.trim().toLocaleLowerCase('pt-BR');const list=athletes.filter(a=>[a.name,a.team,a.category,a.belt,a.ageGroup].join(' ').toLocaleLowerCase('pt-BR').includes(q));const groups={};list.forEach(a=>(groups[a.category||'Categoria não definida']??=[]).push(a));
 content=`<label for="athleteSearch">Buscar atleta, equipe ou categoria</label><input class="searchbar" id="athleteSearch" placeholder="Digite um nome, equipe ou categoria" value="${esc(search)}" oninput="showEvent('${id}','inscricoes',this.value)"><p class="muted">${Object.keys(groups).length} categorias · ${list.length} atletas inscritos</p>${Object.entries(groups).sort((a,b)=>a[0].localeCompare(b[0],'pt-BR')).map(([cat,ats])=>`<div class="category-card"><div class="category-heading"><span>${esc(cat).toUpperCase()}</span><span class="badge">${ats.length}</span></div>${ats.map(a=>`<div class="athlete-row"><div><b>${esc(a.name)}</b><small>${esc(a.team||'Equipe não informada')} · ${esc(a.belt||'Faixa não informada')}</small></div><div style="text-align:right;white-space:nowrap"><b>${esc(a.weight||'—')} kg</b><small>${esc(a.ageGroup||'')}</small></div></div>`).join('')}</div>`).join('')||'<div class="card empty">Nenhum atleta corresponde à busca.</div>'}`;
 }else if(section==='cronograma'){

<th>Confronto</th><th>Status</th></tr>${plan.fights.map((m,i)=>`<tr><td><b>${esc(m.time)}</b></td><td>Quadra ${m.court}</td><td>${esc(m.category)}</td><td>${esc(m.a)} × ${esc(m.b)}</td><td>${esc(m.status)}</td></tr>`).join('')}</table></div>`;}
 const rosterSelect=document.querySelector('#rosterEvent');if(rosterSelect)rosterSelect.addEventListener('change',()=>{renderRoster();renderBrackets();const sf=document.querySelector('#startEventForm');if(sf)sf.elements.eventId.value=rosterSelect.value;renderSchedule()});renderRoster();renderBrackets();
 function makeBrackets(id){const list=db.athletes.filter(a=>a.eventId===id);if(!list.length)return false;const groups={};list.forEach(a=>{(groups[a.category||'Categoria não definida']??=[]).push(a.name)});db.brackets=db.brackets.filter(b=>b.eventId!==id);Object.entries(groups).forEach(([category,names])=>{const pairs=[];for(let base=0;base<names.length;base+=4){const block=names.slice(base,base+4);if(block.length>=3)pairs.push([block[0],block[2]]);else if(block.length===2)pairs.push([block[0],block[1]]);else if(block.length===1)pairs.push([block[0],'Folga — passa direto']);if(block.length===4)pairs.push([block[1],block[3]]);else if(block.length===3)pairs.push([block[1],'Folga — passa direto']);}db.brackets.push({id:crypto.randomUUID(),eventId:id,category,pairs});});return true;}
 const genBtn=document.querySelector('#generateBrackets');if(genBtn)genBtn.addEventListener('click',()=>{const id=document.querySelector('#rosterEvent')?.value;if(!id){alert('Cadastre um evento primeiro.');return;}if(!db.athletes.some(a=>a.eventId===id)){alert('Não há atletas inscritos neste evento.');return;}if(!confirm('Gerar/substituir as chaves seguindo a ordem de inscrição?'))return;makeBrackets(id);save();renderBrackets();alert('Chaves geradas: 1º contra 3º e 2º contra 4º, por grupo de quatro.');});
 const startForm=document.querySelector('#startEventForm');if(startForm){startForm.elements.eventId.value=document.querySelector('#rosterEvent')?.value||db.events[0]?.id||'';startForm.elements.eventId.addEventListener('change',renderSchedule);startForm.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(startForm),id=f.get('eventId'),courts=Number(f.get('courts')),mins=Number(f.get('fightMinutes')),start=f.get('startTime');if(!db.athletes.some(a=>a.eventId===id)){alert('Inscreva pelo menos um atleta antes de iniciar o evento.');return;}if(!confirm('Iniciar este evento? As chaves e os horários anteriores serão substituídos.'))return;makeBrackets(id);const groups=db.brackets.filter(b=>b.eventId===id),all=[];groups.forEach(g=>g.pairs.forEach((pair,i)=>{if(pair[1]&&!pair[1].startsWith('Folga'))all.push({category:g.category,a:pair[0],b:pair[1],round:'ELIMINATÓRIA'});}));const [hh,mm]=start.split(':').map(Number),base=hh*60+mm;const fights=all.map((m,i)=>{const court=(i%courts)+1,slot=Math.floor(i/courts),total=base+slot*mins;return {...m,court,time:String(Math.floor(total/60)%24).padStart(2,'0')+':'+String(total%60).padStart(2,'0')};});db.schedules=db.schedules.filter(x=>x.eventId!==id);db.schedules.push({eventId:id,courts,fightMinutes:mins,startTime:start,fights,courtStatus:Object.fromEntries(Array.from({length:courts},(_,i)=>[i+1,'Parada']))});const ev=db.events.find(x=>x.id===id);if(ev)ev.status='Em andamento';save();renderBrackets();renderSchedule();alert('Evento iniciado! Chaves e horários estimados foram montados.');});renderSchedule();} 
 document.querySelector('#matchForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);db.matches.push({id:crypto.randomUUID(),eventId:f.get('eventId'),category:f.get('category').trim(),blue:f.get('blue').trim(),red:f.get('red').trim(),scoreBlue:f.get('scoreBlue'),scoreRed:f.get('scoreRed'),winner:f.get('winner').trim()});save();render()});
}
function showLivePanel(eventId,panel,court=1){location.hash=`livePanel=${panel}&court=${court}`;showEvent(eventId,'aovivo');}
function startCourt(eventId,court){const p=db.schedules.find(x=>x.eventId===eventId);if(!p)return;if(!p.courtStatus)p.courtStatus={};p.courtStatus[court]='Em andamento';const active=p.fights.find(m=>Number(m.court)===Number(court)&&m.status==='Em andamento');if(!active){const next=p.fights.find(m=>Number(m.court)===Number(court)&&m.status!=='Finalizada');if(next)next.status='Em andamento';}save();render();}
function startAllCourts(eventId){const p=db.schedules.find(x=>x.eventId===eventId);if(!p)return;if(!p.courtStatus)p.courtStatus={};for(let c=1;c<=Number(p.courts);c++){p.courtStatus[c]='Em andamento';if(!p.fights.some(m=>Number(m.court)===c&&m.status==='Em andamento')){const next=p.fights.find(m=>Number(m.court)===c&&m.status!=='Finalizada');if(next)next.status='Em andamento';}}save();render();}
function stopCourt(eventId,court){const p=db.schedules.find(x=>x.eventId===eventId);if(!p)return;if(!p.courtStatus)p.courtStatus={};p.courtStatus[court]='Parada';p.fights.forEach(m=>{if(Number(m.court)===Number(court)&&m.status==='Em andamento')m.status='Pendente'});save();render();}
function stopAllCourts(eventId){const p=db.schedules.find(x=>x.eventId===eventId);if(!p)return;if(!p.courtStatus)p.courtStatus={};for(let c=1;c<=Number(p.courts);c++)stopCourtQuiet(p,c);save();render();}
function stopCourtQuiet(p,c){p.courtStatus[c]='Parada';p.fights.forEach(m=>{if(Number(m.court)===Number(c)&&m.status==='Em andamento')m.status='Pendente'});}
function finishCourtFight(eventId,court,index){const p=db.schedules.find(x=>x.eventId===eventId);if(!p||!p.fights[index])return;const fight=p.fights[index];if(!confirm(`Finalizar a luta #${index+1}: ${fight.a} × ${fight.b}?`))return;fight.status='Finalizada';const next=p.fights.find(m=>Number(m.court)===Number(court)&&m.status==='Pendente');if((p.courtStatus||{})[court]==='Em andamento'&&next)next.status='Em andamento';save();render();}
function setLiveFight(eventId,index,nextStatus){const plan=db.schedules.find(x=>x.eventId===eventId);if(!plan||!plan.fights[index])return;if(nextStatus==='Em andamento'){plan.fights.forEach((f,i)=>{if(Number(f.court)===Number(plan.fights[index].court)&&f.status==='Em andamento')f.status='Pendente'});}plan.fights[index].status=nextStatus;save();showEvent(eventId,'aovivo');}
function deleteEvent(id){if(!confirm('Excluir este campeonato e os dados vinculados?'))return;db.events=db.events.filter(e=>e.id!==id);db.athletes=db.athletes.filter(a=>a.eventId!==id);db.matches=db.matches.filter(m=>m.eventId!==id);save();render()}
function resetData(){if(!confirm('Tem certeza? Isso apaga os dados salvos neste navegador.'))return;db={events:[],athletes:[],matches:[]};save();render()}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-dojo-hamdar.json';a.click();URL.revokeObjectURL(a.href)}
document.querySelector('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(!b)return;view=b.dataset.view;render()});
render();
